<style>
:root{
  --bg:#f0f2f5;--bg2:#fff;--bg3:#f9fafb;
  --text1:#1d2939;--text2:#344054;--text3:#667085;--text4:#98a2b3;
  --border:#e4e7ec;--border2:#d0d5dd;
  --card-shadow:0 2px 8px rgba(0,0,0,.07);
  --navy:#0b1d4a;--red:#c8102e;--gold:#d4af37;
  --ok:#039855;--blue:#3b5bdb;
}
body.dark{
  --bg:#0f1117;--bg2:#1a1d2e;--bg3:#22263a;
  --text1:#e8eaf0;--text2:#c5c9d8;--text3:#8e94b0;--text4:#5c6280;
  --border:#2d3148;--border2:#3d4360;
  --card-shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
  background:var(--bg);color:var(--text1);min-height:100vh;padding-bottom:40px;
  -webkit-text-size-adjust:100%;
}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{max-width:580px;margin:0 auto;padding:12px}

/* ヘッダー */
.header{
  background:linear-gradient(135deg,#0b1d4a 0%,#1a3a7c 100%);
  color:#fff;border-radius:16px;padding:16px;margin-bottom:12px;
  border:2px solid var(--gold);box-shadow:0 4px 16px rgba(11,29,74,.35);
}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.badge-77{background:var(--red);color:var(--gold);border:1px solid var(--gold);font-size:11px;font-weight:900;padding:3px 9px;border-radius:6px;letter-spacing:1px}
.title{font-size:17px;font-weight:900;letter-spacing:.5px;flex:1;margin-left:6px}
.icon-btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}

/* ステータス集計 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-box{background:rgba(0,0,0,.28);border:1px solid rgba(212,175,55,.3);border-radius:10px;padding:8px 4px;text-align:center}
.stat-n{font-size:20px;font-weight:900;line-height:1}
.stat-l{font-size:10px;color:#f5e9c8;margin-top:3px;opacity:.9}

/* 自動更新バー */
.sync-card{
  background:var(--bg2);border-radius:13px;padding:12px;margin-bottom:12px;
  box-shadow:var(--card-shadow);border:1px solid var(--border);
}
.sync-row{display:flex;gap:6px;align-items:center}
.btn{
  border:none;border-radius:10px;padding:11px 12px;font-size:13px;font-weight:800;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  text-decoration:none;
}
.btn:active{transform:scale(.97)}
.btn-sync{background:#3b5bdb;color:#fff;width:100%}
.btn-sync:disabled{opacity:.6;cursor:default}
.sync-status{font-size:11px;color:var(--text3);margin-top:7px;line-height:1.4}
.quick-add-row{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.quick-input{
  flex:1;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border2);
  background:var(--bg3);color:var(--text1);font-size:12px;outline:none;
}
.quick-input:focus{border-color:#3b5bdb}

/* フィルタ */
.filter-bar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.f-chips{display:flex;gap:5px}
.fbtn{
  font-size:12px;padding:6px 13px;border-radius:99px;border:1.5px solid var(--border2);
  background:var(--bg2);color:var(--text3);cursor:pointer;font-weight:700;
}
.fbtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
body.dark .fbtn.active{background:#3b5bdb;border-color:#3b5bdb}

/* 試合カード */
.game-card{
  background:var(--bg2);border-radius:14px;padding:14px;margin-bottom:10px;
  box-shadow:var(--card-shadow);border:1.5px solid var(--border);
  border-left:6px solid var(--red);
}
.game-card.watched{border-left-color:var(--ok);opacity:.9}
.gc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.gc-date{font-size:12px;font-weight:800;color:var(--text3)}
.gc-match{font-size:17px;font-weight:900;color:var(--text1);margin-bottom:4px;line-height:1.3}
.gc-venue{font-size:11px;color:var(--text3);margin-bottom:6px}
.gc-crew{
  font-size:12px;color:var(--text2);background:var(--bg3);
  padding:7px 10px;border-radius:8px;margin-bottom:11px;border:1px solid var(--border);
}
.gc-crew b{color:var(--red)}
body.dark .gc-crew b{color:#fbbf24}

/* 視聴チェックボタン */
.watch-check-btn{
  padding:8px 15px;border-radius:99px;font-size:13px;font-weight:900;cursor:pointer;
  border:2px solid;display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
}
.watch-check-btn.unwatched{background:#fff4e6;color:#d9480f;border-color:#fd7e14}
.watch-check-btn.watched{background:#ecfdf3;color:#027a48;border-color:#12b76a}
body.dark .watch-check-btn.unwatched{background:rgba(253,126,20,.15);color:#fdba74}
body.dark .watch-check-btn.watched{background:rgba(18,183,106,.15);color:#6ee7b7}

/* バスケットLIVE見逃し配信ボタン */
.gc-btns{display:flex;gap:8px}
.btn-live{background:linear-gradient(135deg,#c8102e,#991b1b);color:#fff;flex:1.3}
.btn-app{background:linear-gradient(135deg,#ea580c,#c2410c);color:#fff;flex:1}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:#1d2939;color:#fff;font-size:12px;font-weight:700;
  padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .25s;
  pointer-events:none;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.toast.show{opacity:1}
</style>

<body>

<div class="app">
  <!-- ヘッダー -->
  <div class="header">
    <div class="header-top">
      <span class="badge-77">#77 CC</span>
      <div class="title">加藤 誉樹レフェリー 試合一覧</div>
      <button type="button" class="icon-btn" onclick="toggleDark()" id="dark-btn">🌙 暗色</button>
    </div>
    <div class="stats">
      <div class="stat-box"><div class="stat-n" id="st-total">8</div><div class="stat-l">全試合</div></div>
      <div class="stat-box"><div class="stat-n" id="st-unwatched" style="color:#fde047">6</div><div class="stat-l">未視聴</div></div>
      <div class="stat-box"><div class="stat-n" id="st-watched" style="color:#6ee7b7">2</div><div class="stat-l">✔ 視聴済</div></div>
    </div>
  </div>

  <!-- 最新試合の自動更新バー -->
  <div class="sync-card">
    <div class="sync-row">
      <button type="button" class="btn btn-sync" id="sync-btn" onclick="autoSyncNewGames(true)">
        🔄 最新試合を自動更新
      </button>
    </div>
    <div class="sync-status" id="sync-status">
      ✔ 判明分の試合一覧を表示しています
    </div>
    <div class="quick-add-row">
      <input type="text" id="quick-key" class="quick-input" placeholder="6桁の試合ID(例:506520)またはURLで手動追加も可" oninput="extractKeyInput(this)">
      <button type="button" class="btn" style="background:var(--navy);color:#fff;padding:8px 12px;font-size:12px" onclick="addByScheduleKey()">＋追加</button>
    </div>
  </div>

  <!-- フィルタ切り替え -->
  <div class="filter-bar">
    <div class="f-chips">
      <button type="button" class="fbtn active" id="f-all" onclick="setFilter('all')">すべて</button>
      <button type="button" class="fbtn" id="f-unwatched" onclick="setFilter('unwatched')">☐ 未視聴のみ</button>
      <button type="button" class="fbtn" id="f-watched" onclick="setFilter('watched')">☑ 視聴済のみ</button>
    </div>
    <span style="font-size:11px;color:var(--text4);font-weight:700" id="count-label">8試合</span>
  </div>

  <!-- 試合一覧リスト -->
  <div id="game-list"></div>
</div>

<div class="toast" id="toast">保存しました</div>

<script>
// 過去にスマホ・PCへ登録された古いService Workerとキャッシュが原因でフリーズするのを防ぐため、自動的に登録解除＆キャッシュクリアを実行
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    for (var i = 0; i < regs.length; i++) {
      regs[i].unregister();
    }
  }).catch(function(e) {});
}
if ('caches' in window) {
  caches.keys().then(function(keys) {
    for (var i = 0; i < keys.length; i++) {
      caches.delete(keys[i]);
    }
  }).catch(function(e) {});
}

var STORAGE_WATCHED = "ooguni_ref77_watched_v6";
var STORAGE_EXTRA   = "ooguni_ref77_extra_games_v6";
var STORAGE_DARK    = "ooguni_ref77_dark_v6";

var BASE_GAMES = [
  { key: "506503", date: "2026-10-24 (土)", match: "A東京 vs 三河", venue: "TOYOTA ARENA TOKYO", crew: "加藤 誉樹 ／ 石田 祐二 ／ 佐久間 奈々" },
  { key: "506486", date: "2026-10-21 (水)", match: "北海道 vs 富山", venue: "北海きたえーる", crew: "加藤 誉樹 ／ 冨士 将史 ／ 山田 俊" },
  { key: "506479", date: "2026-10-19 (月)", match: "千葉J vs 東京SR", venue: "LaLa arena TOKYO-BAY", crew: "加藤 誉樹 ／ 大井 陽平 ／ 田中 充" },
  { key: "506471", date: "2026-10-17 (土)", match: "千葉J vs 島根", venue: "LaLa arena TOKYO-BAY", crew: "加藤 誉樹 ／ 加藤 暁生 ／ 岩城 和利" },
  { key: "506457", date: "2026-10-11 (日)", match: "東京SR vs 仙台", venue: "青山学院記念館", crew: "加藤 誉樹 ／ 柳田 雅人 ／ 大山 賢史" },
  { key: "506445", date: "2026-10-09 (金)", match: "東京SR vs 富山", venue: "青山学院記念館", crew: "加藤 誉樹 ／ 柳田 雅人 ／ 大山 賢史" },
  { key: "506428", date: "2026-10-04 (日)", match: "島根 vs 名古屋D", venue: "バンダイナムコアリーナ松江", crew: "加藤 誉樹 ／ 名越 龍男 ／ 富樫 彰子", defaultWatched: true },
  { key: "506416", date: "2026-10-03 (土)", match: "島根 vs 名古屋D", venue: "バンダイナムコアリーナ松江", crew: "加藤 誉樹 ／ 名越 龍男 ／ 富樫 彰子", defaultWatched: true }
];

var watchedMap = {};
var extraGames = [];
var currentFilter = "all";

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function saveWatched() {
  try { localStorage.setItem(STORAGE_WATCHED, JSON.stringify(watchedMap)); } catch(e) {}
}

function saveExtraGames() {
  try { localStorage.setItem(STORAGE_EXTRA, JSON.stringify(extraGames)); } catch(e) {}
}

function getAllGames() {
  var map = {};
  var list = [];
  var combined = extraGames.concat(BASE_GAMES);
  for (var i = 0; i < combined.length; i++) {
    var g = combined[i];
    if (g && g.key && !map[String(g.key)]) {
      map[String(g.key)] = true;
      list.push(g);
    }
  }
  list.sort(function(a, b) { return Number(b.key) - Number(a.key); });
  return list;
}

function toggleWatch(key) {
  watchedMap[key] = !watchedMap[key];
  saveWatched();
  render();
  showToast(watchedMap[key] ? "☑「視聴済」にチェックしました" : "☐「未視聴」に戻しました");
}

function setFilter(f) {
  currentFilter = f;
  var keys = ["all", "unwatched", "watched"];
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var btn = document.getElementById("f-" + k);
    if (btn) {
      if (k === f) btn.classList.add("active");
      else btn.classList.remove("active");
    }
  }
  render();
}

function openBasketLiveApp(key) {
  var webUrl = "https://basketball.mb.softbank.jp/lives/" + encodeURIComponent(key);
  var ua = navigator.userAgent || "";
  if (/Android/i.test(ua)) {
    window.location.href = "intent://basketball.mb.softbank.jp/lives/" + encodeURIComponent(key) + "#Intent;scheme=https;package=jp.softbank.mb.basketball;S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end";
  } else {
    window.open(webUrl, "_blank", "noopener");
  }
}

function render() {
  var all = getAllGames();
  var total = all.length;
  var watchedCount = 0;
  for (var i = 0; i < all.length; i++) {
    if (watchedMap[all[i].key]) watchedCount++;
  }
  var unwatchedCount = total - watchedCount;

  document.getElementById("st-total").textContent = total;
  document.getElementById("st-unwatched").textContent = unwatchedCount;
  document.getElementById("st-watched").textContent = watchedCount;

  var filtered = [];
  for (var j = 0; j < all.length; j++) {
    var g = all[j];
    var isW = !!watchedMap[g.key];
    if (currentFilter === "unwatched" && isW) continue;
    if (currentFilter === "watched" && !isW) continue;
    filtered.push(g);
  }

  document.getElementById("count-label").textContent = filtered.length + "試合";
  var listEl = document.getElementById("game-list");

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="sync-card" style="text-align:center;color:var(--text3);padding:28px">該当する試合はありません。</div>';
    return;
  }

  var html = "";
  for (var m = 0; m < filtered.length; m++) {
    var item = filtered[m];
    var w = !!watchedMap[item.key];
    var liveUrl = "https://basketball.mb.softbank.jp/lives/" + encodeURIComponent(item.key);
    var crewHtml = esc(item.crew).replace(/加藤\s*誉樹/g, "<b>加藤 誉樹(#77)</b>");

    html += '<div class="game-card ' + (w ? 'watched' : '') + '">'
      + '<div class="gc-top">'
      + '<span class="gc-date">📅 ' + esc(item.date) + ' <span style="opacity:.6">(ID:' + esc(item.key) + ')</span></span>'
      + '<button type="button" class="watch-check-btn ' + (w ? 'watched' : 'unwatched') + '" onclick="toggleWatch('' + esc(item.key) + '')">'
      + (w ? '☑ 視聴済' : '☐ 未視聴')
      + '</button>'
      + '</div>'
      + '<div class="gc-match">' + esc(item.match) + '</div>'
      + (item.venue ? '<div class="gc-venue">📍 ' + esc(item.venue) + '</div>' : '')
      + '<div class="gc-crew">👨‍⚖️ 審判：' + crewHtml + '</div>'
      + '<div class="gc-btns">'
      + '<a class="btn btn-live" href="' + liveUrl + '" target="_blank" rel="noopener">🏀 見逃し配信を開く</a>'
      + '<button type="button" class="btn btn-app" onclick="openBasketLiveApp('' + esc(item.key) + '')">📱 アプリで開く</button>'
      + '</div>'
      + '</div>';
  }
  listEl.innerHTML = html;
}

async function fetchTextWithFallback(targetUrl) {
  var proxies = [
    function(u) { return "https://r.jina.ai/" + u; },
    function(u) { return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); },
    function(u) { return "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u); }
  ];
  for (var i = 0; i < proxies.length; i++) {
    try {
      var ctrl = new AbortController();
      var timerId = setTimeout(function() { ctrl.abort(); }, 4500);
      var res = await fetch(proxies[i](targetUrl), { signal: ctrl.signal });
      clearTimeout(timerId);
      if (res.ok) {
        var txt = await res.text();
        if (txt && txt.length > 80) return txt;
      }
    } catch (e) {}
  }
  return null;
}

function parseBLeagueGameDetail(text, scheduleKey) {
  if (!text) return null;
  if (!/加藤[\s　]*誉樹/.test(text)) return null;

  var crew = "加藤 誉樹";
  var lines = text.split(/[
]+/);
  for (var i = 0; i < lines.length; i++) {
    var idx = lines[i].indexOf("レフェリー");
    if (idx !== -1) {
      var sub = lines[i].substring(idx).replace(/^レフェリー[：:\s]*/, "").replace(/<[^>]*>/g, "").trim();
      if (sub) { crew = sub; break; }
    }
  }

  var dateStr = "2026-27シーズン";
  var dm = text.match(/(202[67])[.\/年](\d{1,2})[.\/月](\d{1,2})/);
  if (dm) {
    var mm = dm[2].length === 1 ? "0" + dm[2] : dm[2];
    var dd = dm[3].length === 1 ? "0" + dm[3] : dm[3];
    dateStr = dm[1] + "-" + mm + "-" + dd;
  }

  var matchStr = "B.PREMIER 試合 (ID:" + scheduleKey + ")";
  var titleMatch = text.match(/([^\s|｜<]{2,15})\s*(?:vs|VS|対)\s*([^\s|｜>]{2,15})/);
  if (titleMatch) {
    matchStr = titleMatch[1] + " vs " + titleMatch[2];
  }

  return {
    key: String(scheduleKey),
    date: dateStr,
    match: matchStr,
    venue: "",
    crew: crew
  };
}

async function autoSyncNewGames(isManual) {
  var statusEl = document.getElementById("sync-status");
  var btnEl = document.getElementById("sync-btn");
  if (btnEl) btnEl.disabled = true;
  if (statusEl) statusEl.textContent = "🔄 最新試合データをバックグラウンドで確認中...";

  var addedCount = 0;
  var all = getAllGames();
  var existingKeys = {};
  for (var i = 0; i < all.length; i++) {
    existingKeys[String(all[i].key)] = true;
  }

  try {
    var sUrl = "https://www.bing.com/search?q=" + encodeURIComponent('site:bleague.jp/game_detail/ "加藤 誉樹" "2026"');
    var searchTxt = await fetchTextWithFallback(sUrl);
    var candidateKeys = [];

    if (searchTxt) {
      var re = /ScheduleKey=(\d{6})/gi;
      var m;
      while ((m = re.exec(searchTxt)) !== null) {
        var foundKey = m[1];
        if (!existingKeys[foundKey] && candidateKeys.indexOf(foundKey) === -1) {
          candidateKeys.push(foundKey);
        }
      }
    }

    for (var j = 0; j < candidateKeys.length; j++) {
      var k = candidateKeys[j];
      var detailUrl = "https://www.bleague.jp/game_detail/?ScheduleKey=" + k + "&tab=4";
      var pageTxt = await fetchTextWithFallback(detailUrl);
      var parsed = parseBLeagueGameDetail(pageTxt, k);
      if (parsed) {
        extraGames.unshift(parsed);
        existingKeys[k] = true;
        addedCount++;
      }
    }

    if (addedCount > 0) {
      saveExtraGames();
      render();
      if (statusEl) statusEl.textContent = "✅ 新しく " + addedCount + " 試合を自動追加しました！";
      showToast("🎉 新着 " + addedCount + " 試合を追加しました！");
    } else {
      var now = new Date();
      var hh = String(now.getHours()).padStart(2, "0");
      var min = String(now.getMinutes()).padStart(2, "0");
      if (statusEl) statusEl.textContent = "✔ 最新状態（最終チェック: " + (now.getMonth() + 1) + "/" + now.getDate() + " " + hh + ":" + min + "）";
      if (isManual) showToast("✔ すでに最新状態です");
    }
  } catch (e) {
    if (statusEl) statusEl.textContent = "✔ 判明分の最新一覧を表示しています";
  } finally {
    if (btnEl) btnEl.disabled = false;
  }
}

function extractKeyInput(el) {
  var val = el.value || "";
  var m = val.match(/ScheduleKey=(\d{6})/i) || val.match(/\/lives\/(\d{6})/i) || val.match(/(\d{6})/);
  if (m && m[1]) el.value = m[1];
}

async function addByScheduleKey() {
  var inp = document.getElementById("quick-key");
  extractKeyInput(inp);
  var key = (inp.value || "").trim();
  if (!/^\d{6}$/.test(key)) {
    alert("6桁の試合ID（例：506520）またはURLを入力してください。");
    return;
  }

  var all = getAllGames();
  for (var i = 0; i < all.length; i++) {
    if (String(all[i].key) === key) {
      showToast("すでに一覧にあります");
      inp.value = "";
      return;
    }
  }

  var statusEl = document.getElementById("sync-status");
  if (statusEl) statusEl.textContent = "⏳ 試合ID:" + key + " の情報を取得中...";

  var detailUrl = "https://www.bleague.jp/game_detail/?ScheduleKey=" + key + "&tab=4";
  var txt = await fetchTextWithFallback(detailUrl);
  var newGame = parseBLeagueGameDetail(txt, key);

  if (!newGame) {
    var today = new Date().toISOString().slice(0, 10);
    newGame = {
      key: key,
      date: today,
      match: "B.PREMIER 担当試合 (ID:" + key + ")",
      venue: "",
      crew: "加藤 誉樹 ほか"
    };
  }

  extraGames.unshift(newGame);
  saveExtraGames();
  inp.value = "";
  render();
  if (statusEl) statusEl.textContent = "✅ 試合 (ID:" + key + ") を一覧に追加しました！";
  showToast("➕ 一覧に追加しました！");
}

function toggleDark() {
  document.body.classList.toggle("dark");
  var isD = document.body.classList.contains("dark");
  try { localStorage.setItem(STORAGE_DARK, isD ? "1" : "0"); } catch(e) {}
  document.getElementById("dark-btn").textContent = isD ? "☀️ 明色" : "🌙 暗色";
}

function showToast(msg) {
  var t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 2200);
}

function init() {
  try {
    if (localStorage.getItem(STORAGE_DARK) === "1") {
      document.body.classList.add("dark");
      document.getElementById("dark-btn").textContent = "☀️ 明色";
    }
  } catch(e) {}

  try {
    // 以前のバージョン(v3〜v5)でチェックした視聴履歴も引き継ぐ
    var rawW = localStorage.getItem(STORAGE_WATCHED) || localStorage.getItem("ooguni_ref77_watched_v5") || localStorage.getItem("ooguni_ref77_watched_v4") || localStorage.getItem("ooguni_ref77_watched_v3");
    if (rawW) {
      watchedMap = JSON.parse(rawW);
    } else {
      for (var i = 0; i < BASE_GAMES.length; i++) {
        if (BASE_GAMES[i].defaultWatched) watchedMap[BASE_GAMES[i].key] = true;
      }
      saveWatched();
    }
  } catch (e) { watchedMap = {}; }

  try {
    var rawE = localStorage.getItem(STORAGE_EXTRA) || localStorage.getItem("ooguni_ref77_extra_games_v5") || localStorage.getItem("ooguni_ref77_extra_games_v3");
    extraGames = JSON.parse(rawE || "[]");
  } catch (e) { extraGames = []; }

  render();

  setTimeout(function() {
    autoSyncNewGames(false);
  }, 1000);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
</body>
</html>
